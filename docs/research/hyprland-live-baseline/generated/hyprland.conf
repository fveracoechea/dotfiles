exec-once = /nix/store/2swbxihjql78pnn5kfmhjq5dvp9m744b-dbus-1.16.2/bin/dbus-update-activation-environment --systemd DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE && systemctl --user stop hyprland-session.target && systemctl --user start hyprland-session.target
exec-shutdown = systemctl --user stop hyprland-session.target
bindd=SUPER, J, Toggle window split, layoutmsg, togglesplit,
bindd=SUPER, T, Toggle window floating/tiling, togglefloating,
bindd=SUPER, F, Full screen, fullscreen, 0
bindd=SUPER CTRL, F, Tiled full screen, fullscreenstate, 0 2
bindd=SUPER ALT, F, Full width, fullscreen, 1
bindd=SUPER, W, Close window, killactive
bindd=SUPER, K, Move window focus U, movefocus, u
bindd=SUPER, J, Move window focus D, movefocus, d
bindd=SUPER, L, Move window focus R, movefocus, r
bindd=SUPER, H, Move window focus L, movefocus, l
bindd=SUPER CTRL, K, Resize active window K, resizeactive, 0 -100
bindd=SUPER CTRL, J, Resize active window J, resizeactive, 0 100
bindd=SUPER CTRL, L, Resize active window L, resizeactive, 100 0
bindd=SUPER CTRL, H, Resize active window H, resizeactive, -100 0
bindd=SUPER, P, Pseudo window, pseudo,
bindd=SUPER CTRL, P, Toggle All Pseudo window, exec, hyprctl dispatch workspaceopt allpseudo
bindd=SUPER, TAB, Next workspace, workspace, e+1
bindd=SUPER SHIFT, TAB, Previous workspace, workspace, e-1
bindd=SUPER CTRL, TAB, Former workspace, workspace, previous
bindd=SUPER, G, Toggle window grouping, togglegroup
bindd=SUPER ALT, G, Move active window out of group, moveoutofgroup
bindd=SUPER, B, Open google-chrome-stable, exec, google-chrome-stable
bindd=SUPER, S, Open ghostty, exec, ghostty
bindd=SUPER, A, Open fuzzel --cache /home/fveracoechea/.config/fuzzel/cache, exec, fuzzel --cache /home/fveracoechea/.config/fuzzel/cache
bindd=SUPER, O, Open handy --toggle-transcription, exec, handy --toggle-transcription
bindd=SUPER, C, Copy, sendshortcut, CTRL, INSERT, activewindow
bindd=SUPER, V, Paste, sendshortcut, SHIFT, INSERT, activewindow
bindd=SUPER, 1, Switch to workspace 1, workspace, 1
bindd=SUPER, 2, Switch to workspace 2, workspace, 2
bindd=SUPER, 3, Switch to workspace 3, workspace, 3
bindd=SUPER, 4, Switch to workspace 4, workspace, 4
bindd=SUPER, 5, Switch to workspace 5, workspace, 5
bindd=SUPER, 6, Switch to workspace 6, workspace, 6
bindd=SUPER, 7, Switch to workspace 7, workspace, 7
bindd=SUPER, 8, Switch to workspace 8, workspace, 8
bindd=SUPER, 9, Switch to workspace 9, workspace, 9
bindd=SUPER SHIFT, 1, Move active window to workspace 1, movetoworkspace, 1
bindd=SUPER SHIFT, 2, Move active window to workspace 2, movetoworkspace, 2
bindd=SUPER SHIFT, 3, Move active window to workspace 3, movetoworkspace, 3
bindd=SUPER SHIFT, 4, Move active window to workspace 4, movetoworkspace, 4
bindd=SUPER SHIFT, 5, Move active window to workspace 5, movetoworkspace, 5
bindd=SUPER SHIFT, 6, Move active window to workspace 6, movetoworkspace, 6
bindd=SUPER SHIFT, 7, Move active window to workspace 7, movetoworkspace, 7
bindd=SUPER SHIFT, 8, Move active window to workspace 8, movetoworkspace, 8
bindd=SUPER SHIFT, 9, Move active window to workspace 9, movetoworkspace, 9

bindm=SHIFT_ALT, mouse:272, movewindow

binds {
  allow_workspace_cycles=true
  drag_threshold=10
}

cursor {
  enable_hyprcursor=false
}

decoration {
  blur {
    enabled=true
  }
  rounding=8
}

dwindle {
  force_split=2
  preserve_split=true
}

ecosystem {
  no_update_news=true
}

env=BROWSER,google-chrome-stable
env=GDK_BACKEND,wayland,x11,*
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_STYLE_OVERRIDE,kvantum
env=SDL_VIDEODRIVER,wayland
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=OZONE_PLATFORM,wayland
env=XDG_SESSION_TYPE,wayland
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=XDG_CURRENT_DESKTOP,Hyprland
env=XDG_SESSION_DESKTOP,Hyprland
env=XCURSOR_SIZE,38
env=HYPRCURSOR_SIZE,38

exec-once=ultrashell

general {
  border_size=3
  col.active_border=rgb(89b4fa) rgb(f2cdcd) 90deg
  col.inactive_border=rgb(585b70)
  gaps_in=10
  gaps_out=10,18,18,18
  layout=dwindle
  resize_on_border=true
}

layout {
  single_window_aspect_ratio=16 9
}

master {
  allow_small_split=true
  mfact=0.320000
  new_on_top=false
}

misc {
  animate_manual_resizes=true
  animate_mouse_windowdragging=true
  vrr=2
}

monitor=DP-1, 5120x1440@119.98Hz, auto, auto, bitdepth, 8, cm, auto
monitor=HDMI-A-1, disable

windowrule=float on, match:tag floating-window
windowrule=center on, match:tag floating-window
windowrule=size 1024 768, match:tag floating-window
windowrule=tag +floating-window, match:class (blueberry.py|Impala|Wiremix|org.gnome.NautilusPreviewer|com.gabm.satty|TUI.float|imv|mpv)
windowrule=tag +floating-window, match:class (xdg-desktop-portal-gtk|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
windowrule=float on, match:class org.gnome.Calculator
windowrule=border_size 0, match:fullscreen 1
windowrule=idle_inhibit fullscreen, match:class .*
windowrule=suppress_event maximize, match:class .*

workspace=1, persistent:true
workspace=2, persistent:true
workspace=3, persistent:true
workspace=4, persistent:true
workspace=5, persistent:true

xwayland {
  force_zero_scaling=true
}
