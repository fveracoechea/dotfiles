background {
  blur_passes=1
  blur_size=4
  path=$HOME/dotfiles/assets/wallpapers/dark-forrest-ultrawide.png
}

general {
  disable_loading_bar=true
  hide_cursor=true
}

image {
  size=300
  border_color=rgb(b4befe)
  halign=center
  path=$HOME/dotfiles/assets/face.jpg
  rounding=8
  valign=center
}

input-field {
  size=300, 60
  capslock_color=rgb(f9e2af)
  check_color=rgb(89b4fa)
  dots_center=true
  dots_size=0.200000
  dots_spacing=0.200000
  fade_on_empty=false
  fail_color=rgb(f38ba8)
  fail_text=󱙱  $FAIL ($ATTEMPTS)
  font_color=rgb(cdd6f4)
  halign=center
  hide_input=false
  inner_color=rgb(313244)
  outer_color=rgb(89b4fa)
  outline_thickness=4
  placeholder_text=  $USER
  position=0, -205
  rounding=8
  valign=center
}

label {
  font_size=44
  halign=center
  position=0, 250
  text=cmd[update:5000] echo $(date '+%I:%M %p')
  valign=center
}

label {
  font_size=22
  halign=center
  position=0, 200
  text=cmd[update:5000] echo $(date '+%A, %B %d')
  valign=center
}
